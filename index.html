<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guitare V1.2 — iPad</title>
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guitare V1">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
body{margin:0;background:#101114;color:#f5f5f7;min-height:100vh;display:grid;place-items:center}
main{width:min(92vw,760px);text-align:center;padding:24px}
h1{font-size:clamp(28px,6vw,48px);margin:0 0 8px}
.sub{color:#aaa;margin-bottom:28px}
.card{background:#1c1d21;border:1px solid #333;border-radius:22px;padding:28px}
.note{font-size:clamp(72px,22vw,150px);font-weight:800;line-height:1}
.freq{font-size:22px;color:#bbb;margin:12px 0}
.pos{font-size:26px;margin:18px 0;min-height:34px}
.meter{height:18px;background:#333;border-radius:20px;position:relative;margin:28px 0 10px;overflow:hidden}
.center{position:absolute;left:49.5%;width:1%;height:100%;background:white}
.needle{position:absolute;left:50%;top:0;width:8px;height:100%;background:#aaa;border-radius:5px;transform:translateX(-50%);transition:left .08s}
.cents{color:#bbb}
button{font-size:22px;font-weight:700;padding:16px 28px;border:0;border-radius:16px;margin-top:24px;cursor:pointer}
#status{margin-top:16px;color:#aaa;min-height:24px}
.good{color:#76e08a!important}
</style>
</head>
<body>
<main>
<h1>🎸 Guitare V1.2</h1>
<div class="sub">Détection de note — accordage standard E A D G B E</div>
<div class="card">
<div id="note" class="note">—</div>
<div id="freq" class="freq">0.0 Hz</div>
<div id="pos" class="pos">Joue une note</div>
<div class="meter"><div class="center"></div><div id="needle" class="needle"></div></div>
<div id="cents" class="cents">—</div>
<button id="start">Démarrer l'écoute</button><button id="stop" style="display:none;background:#494b52;color:white">Arrêter</button>
<div id="status" role="status" aria-live="polite">Le navigateur demandera l'autorisation d'utiliser le micro.</div>
</div>
</main>
<script>
const stopButton=document.querySelector("#stop");
let stream=null, source=null, timer=null, session=0, starting=false;
const noteEl=document.querySelector('#note'),freqEl=document.querySelector('#freq'),
posEl=document.querySelector('#pos'), centsEl=document.querySelector('#cents'),
needle=document.querySelector('#needle'), statusEl=document.querySelector('#status'),
button=document.querySelector('#start');

const names=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const strings=[
 {n:6,m:40,label:"Mi grave"}, {n:5,m:45,label:"La"}, {n:4,m:50,label:"Ré"},
 {n:3,m:55,label:"Sol"}, {n:2,m:59,label:"Si"}, {n:1,m:64,label:"Mi aigu"}
];
let ctx, analyser, data, running=false, lastNote="", stableCount=0;

function autoCorrelate(buf, rate){
 let size=buf.length, rms=0;
 for(let i=0;i<size;i++) rms+=buf[i]*buf[i];
 rms=Math.sqrt(rms/size); if(rms<0.012) return -1;
 let r1=0,r2=size-1,th=.2;
 for(let i=0;i<size/2;i++) if(Math.abs(buf[i])<th){r1=i;break}
 for(let i=1;i<size/2;i++) if(Math.abs(buf[size-i])<th){r2=size-i;break}
 buf=buf.slice(r1,r2); size=buf.length;
 let c=new Array(size).fill(0);
 for(let lag=0;lag<size;lag++)
   for(let i=0;i<size-lag;i++) c[lag]+=buf[i]*buf[i+lag];
 let d=0; while(d+1<size && c[d]>c[d+1]) d++;
 let max=-1,pos=-1;
 for(let i=d;i<size;i++) if(c[i]>max){max=c[i];pos=i}
 if(pos<=0) return -1;
 let x1=c[pos-1]||c[pos],x2=c[pos],x3=c[pos+1]||c[pos];
 let a=(x1+x3-2*x2)/2,b=(x3-x1)/2;
 if(a) pos-=b/(2*a);
 return rate/pos;
}
function midiFromFreq(f){return 69+12*Math.log2(f/440)}
function noteName(m){
 let r=Math.round(m); return names[(r%12+12)%12]+(Math.floor(r/12)-1)
}
function guitarPosition(midi){
 let m=Math.round(midi), opts=[];
 strings.forEach(s=>{let fret=m-s.m;if(fret>=0&&fret<=22) opts.push({s:s.n,f:fret,label:s.label})});
 if(!opts.length)return "Hors tessiture guitare";
 opts.sort((a,b)=>a.f-b.f);
 let p=opts[0];
 return `Corde ${p.s} (${p.label}) — case ${p.f}`;
}
function tick(){
 if(!running)return;
 analyser.getFloatTimeDomainData(data);
 let f=autoCorrelate(data,ctx.sampleRate);
 if(f>70&&f<1400){
   let m=midiFromFreq(f), nearest=Math.round(m);
   let cents=Math.round(100*(m-nearest));
   const detected=noteName(m);
   stableCount=detected===lastNote?stableCount+1:0;lastNote=detected;
   if(stableCount<3){timer=setTimeout(tick,100);return;}
   noteEl.textContent=detected;
   freqEl.textContent=f.toFixed(1)+" Hz";
   posEl.textContent=guitarPosition(m);
   centsEl.textContent=(cents>0?"+":"")+cents+" cents";
   needle.style.left=(50+Math.max(-45,Math.min(45,cents*.9)))+"%";
   centsEl.className=Math.abs(cents)<=5?"cents good":"cents";
 } else {
   lastNote=""; stableCount=0; noteEl.textContent="—"; centsEl.textContent="—"; needle.style.left="50%"; freqEl.textContent="— Hz"; posEl.textContent="Joue une note clairement";
 }
 timer=setTimeout(tick,100);
}

function stopListening(message="Micro arrêté.") {
 session++; running=false; starting=false;
 clearTimeout(timer); timer=null;
 if(stream) stream.getTracks().forEach(t=>t.stop());
 stream=null;
 if(source) { try { source.disconnect(); } catch {} } source=null;
 const oldContext=ctx; ctx=null;
 if(oldContext) { oldContext.onstatechange=null; oldContext.close().catch(()=>{}); }
 analyser=null; data=null; lastNote=""; stableCount=0;
 stopButton.style.display="none"; button.style.display="inline-block";
 button.disabled=false; button.textContent="Démarrer l'écoute";
 noteEl.textContent="—"; freqEl.textContent="— Hz"; posEl.textContent="Écoute arrêtée";
 centsEl.textContent="—"; centsEl.className="cents"; needle.style.left="50%";
 statusEl.textContent=message;
}
stopButton.onclick=()=>stopListening();
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopListening("Micro arrêté en quittant l’application. Appuie sur Démarrer pour reprendre.");});
window.addEventListener('pagehide',()=>stopListening());
function microphoneError(e) {
 const tips={
 NotAllowedError:"Accès au micro refusé. Autorise le microphone dans les réglages de ce site, puis réessaie. Sur iPad, ouvre le lien directement dans Safari.",
 NotFoundError:"Aucun microphone disponible. Vérifie le micro de l’appareil ou le casque connecté.",
 NotReadableError:"Le microphone est indisponible. Ferme les autres applications qui l’utilisent, puis réessaie.",
 SecurityError:"Le navigateur bloque le micro. Ouvre le lien HTTPS directement dans Safari ou Chrome."
 };
 return tips[e.name] || "Impossible de démarrer : "+e.message;
}
button.onclick=async()=>{
 if(starting||running)return;
 const current=++session; starting=true;
 button.disabled=true; button.textContent="Autorisation du micro…";
 stopButton.style.display="inline-block";
 statusEl.textContent="Autorise le microphone dans la demande du navigateur.";
 try {
  if(!window.isSecureContext)throw new Error("Ouvre https://fredroum.github.io/guitare-v1/ pour utiliser le micro.");
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("Micro non disponible dans ce navigateur. Ouvre le lien directement dans Safari sur iPad, ou Chrome sur Android.");
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)throw new Error("Ce navigateur ne prend pas en charge l’audio. Mets-le à jour.");
  // Resume synchronously within the tap, before awaiting microphone permission.
  const audio=new Audio(); ctx=audio;
  const resumed=audio.resume().catch(()=>{});
  const acquired=await navigator.mediaDevices.getUserMedia({audio:true});
  if(current!==session){acquired.getTracks().forEach(t=>t.stop());return;}
  stream=acquired;
  // Do not wait forever on a suspended Safari audio context.
  await Promise.race([resumed,new Promise(resolve=>setTimeout(resolve,1500))]);
  if(current!==session)return;
  if(audio.state!=="running")throw new Error("Audio suspendu. Appuie à nouveau sur Démarrer et garde Safari au premier plan.");
  analyser=audio.createAnalyser(); analyser.fftSize=4096;
  source=audio.createMediaStreamSource(stream); source.connect(analyser);
  data=new Float32Array(analyser.fftSize); running=true; starting=false;
  button.style.display="none";
  statusEl.textContent="Micro actif. Joue une seule corde près de l’appareil.";
  stream.getTracks().forEach(t=>t.addEventListener('ended',()=>{if(current===session)stopListening("Micro déconnecté. Appuie sur Démarrer pour réessayer.");}));
  audio.onstatechange=()=>{if(current===session&&audio.state!=="running")stopListening("Audio interrompu. Appuie sur Démarrer pour reprendre.");};
  tick();
 }catch(e){if(current===session)stopListening(microphoneError(e));}
};
</script>
</body></html>
